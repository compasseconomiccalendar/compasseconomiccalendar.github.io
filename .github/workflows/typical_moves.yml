name: Recompute typical moves

# Deliberately separate from the weekly calendar refresh. These statistics
# move slowly, the job pulls years of history, and if the price source breaks
# the calendar must still build.
on:
  schedule:
    # 05:00 UTC on the 1st of each month.
    - cron: "0 5 1 * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ingestion/build_typical_moves.py"
      - ".github/workflows/typical_moves.yml"

permissions:
  contents: write

concurrency:
  group: typical-moves
  cancel-in-progress: false

jobs:
  compute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s ingestion -p 'test_*.py'

      - name: Compute typical moves
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python ingestion/build_typical_moves.py

      - name: Commit the recomputed statistics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/typical_moves.json
          if git diff --staged --quiet; then
            echo "No change in typical moves."
          else
            git commit -m "chore: recompute typical move statistics [skip ci]"
            git push
          fi
