<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="popup.css">
<title>Compass Economic Calendar</title>
</head>
<body>
  <header>
    <h1>Compass</h1>
    <div class="controls">
      <label class="sr-only" for="impact">Minimum impact</label>
      <select id="impact">
        <option value="low">All events</option>
        <option value="medium">Medium &amp; high</option>
        <option value="high">High only</option>
      </select>
      <button id="refresh" title="Refresh feed" aria-label="Refresh feed">↻</button>
      <button id="options" title="Settings" aria-label="Settings">⚙</button>
    </div>
  </header>

  <div id="list-view">
    <div id="chips" class="chips"></div>
    <div id="banner" class="banner" hidden></div>
    <ul id="events" class="events"></ul>
    <p id="empty" class="empty" hidden></p>
    <p id="more" class="more" hidden></p>
  </div>

  <section id="detail-view" class="detail" hidden>
    <button id="back" class="back">← All events</button>
    <h2 id="detail-title"></h2>
    <dl id="detail-times" class="times"></dl>
    <p id="detail-note" class="detail-note"></p>
    <dl id="detail-rows" class="rows"></dl>
    <a id="detail-source" class="verify" target="_blank" rel="noreferrer"></a>
    <a id="detail-primary" class="verify secondary" target="_blank" rel="noreferrer" hidden></a>
    <p id="detail-attribution" class="legal" hidden></p>
  </section>

  <footer>
    <p id="status" class="status"></p>
    <p class="legal">
      For informational and educational purposes only. Not investment advice.
      Verify times against official sources before trading.
    </p>
    <p class="legal">
      This product uses the FRED® API but is not endorsed or certified by the
      Federal Reserve Bank of St. Louis.
    </p>
  </footer>

  <script type="module" src="popup.js"></script>
</body>
</html>
